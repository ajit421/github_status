<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Stats Card Builder</title>
  <style>
    /* CSS Design Tokens */
    :root {
      --color-bg: #0d1117;
      --color-surface: #161b22;
      --color-border: #30363d;
      --color-text: #e6edf3;
      --color-muted: #8b949e;
      --color-accent: #58a6ff;
      --color-success: #3fb950;
      --color-error: #f85149;
      --color-warning: #e3b341;
      --radius: 6px;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Layout */
    .container {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    
    @media (min-width: 768px) {
      .container {
        flex-direction: row;
      }
    }

    .panel-left {
      padding: 24px;
      border-right: 1px solid var(--color-border);
      width: 100%;
      background-color: var(--color-surface);
      overflow-y: auto;
    }

    .panel-right {
      padding: 24px;
      width: 100%;
      display: flex;
      flex-direction: column;
      background-color: var(--color-bg);
    }
    
    @media (min-width: 768px) {
      .panel-left { width: 350px; flex-shrink: 0; }
      .panel-right { position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    }

    h1, h2, h3 { margin-bottom: 16px; font-weight: 600; }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
    h2 { font-size: 16px; color: var(--color-muted); border-bottom: 1px solid var(--color-border); padding-bottom: 8px; margin-top: 24px; }
    
    /* Controls */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
    }

    input[type="text"], select {
      width: 100%;
      padding: 8px 12px;
      background-color: var(--color-bg);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      border-radius: var(--radius);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--color-accent);
    }

    input[type="text"].error {
      border-color: var(--color-error);
    }

    .error-msg {
      color: var(--color-error);
      font-size: 12px;
      margin-top: 4px;
      display: none;
    }
    
    .error-msg.show {
      display: block;
    }

    /* Toggles / Checkboxes */
    .toggle-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    .toggle-group input[type="checkbox"] {
      cursor: pointer;
    }
    
    /* Radio group */
    .radio-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .radio-label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Color picker row */
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .color-row label {
      flex: 1;
      margin-bottom: 0;
    }
    input[type="color"] {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      cursor: pointer;
      background-color: transparent;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 3px; }
    .hex-input {
      width: 80px !important;
      font-family: var(--font-mono) !important;
      font-size: 13px !important;
    }

    button {
      background-color: var(--color-surface);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      padding: 6px 12px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 14px;
      font-family: var(--font-sans);
      transition: all 0.2s;
    }
    button:hover { background-color: var(--color-border); }
    .btn-primary {
      background-color: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #ffffff;
    }
    .btn-primary:hover { background-color: #2ea043; }

    .reset-btn { width: 100%; margin-top: 24px; }

    .note { font-size: 12px; color: var(--color-warning); margin-bottom: 16px; }

    /* Preview Area */
    .preview-box {
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background-color: var(--color-surface);
      padding: 24px;
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      position: relative;
    }

    .preview-img { max-width: 100%; height: auto; display: block; }
    
    .loading-skeleton {
      position: absolute;
      inset: 0;
      background-color: var(--color-surface);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .loading-skeleton.active { opacity: 1; pointer-events: auto; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-overlay {
      position: absolute;
      inset: 0;
      background-color: rgba(13, 17, 23, 0.9);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      color: var(--color-error);
      text-align: center;
      padding: 24px;
    }
    .error-overlay.active { opacity: 1; pointer-events: auto; }

    .info-list {
      list-style: none;
      font-size: 13px;
      color: var(--color-muted);
      margin-bottom: 24px;
    }
    .info-list li { margin-bottom: 4px; }

    .code-block {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 13px;
      overflow-x: auto;
      margin-bottom: 12px;
      color: var(--color-text);
      word-break: break-all;
    }

    .action-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- LEFT PANEL: CONTROLS -->
    <div class="panel-left">
      <h1>🔧 Card Builder</h1>
      
      <div class="form-group" style="margin-top: 24px;">
        <label for="username">GitHub Username</label>
        <input type="text" id="username" placeholder="e.g. ajit421" value="ajit421" />
        <div id="username-error" class="error-msg">Enter a valid GitHub username</div>
      </div>

      <div class="form-group">
        <label for="card-type">Card Type</label>
        <select id="card-type">
          <option value="stats">GitHub Stats</option>
          <option value="top-langs">Top Languages</option>
          <option value="streak">Streak Stats</option>
          <option value="commit-activity">Commit Activity</option>
        </select>
      </div>

      <h2>Appearance</h2>
      <div class="form-group">
        <label for="theme">Theme</label>
        <select id="theme">
          <option value="default">default</option>
          <option value="dark">dark</option>
          <option value="tokyonight" selected>tokyonight</option>
          <option value="radical">radical</option>
        </select>
      </div>

      <h2>Card Options</h2>
      <div id="dynamic-options">
        <!-- Rendered via JS based on Card Type -->
      </div>

      <div id="custom-colors-section">
        <h2>Custom Colors</h2>
        <div class="color-row">
          <label>Background</label>
          <input type="color" id="bg_color_picker" value="#0d1117">
          <input type="text" id="bg_color_hex" class="hex-input" placeholder="0d1117">
        </div>
        <div class="color-row">
          <label>Text Color</label>
          <input type="color" id="text_color_picker" value="#e6edf3">
          <input type="text" id="text_color_hex" class="hex-input" placeholder="e6edf3">
        </div>
        <div class="color-row">
          <label>Title Color</label>
          <input type="color" id="title_color_picker" value="#58a6ff">
          <input type="text" id="title_color_hex" class="hex-input" placeholder="58a6ff">
        </div>
        <div class="color-row">
          <label>Icon Color</label>
          <input type="color" id="icon_color_picker" value="#3fb950">
          <input type="text" id="icon_color_hex" class="hex-input" placeholder="3fb950">
        </div>
        <div class="color-row">
          <label>Border Color</label>
          <input type="color" id="border_color_picker" value="#30363d">
          <input type="text" id="border_color_hex" class="hex-input" placeholder="30363d">
        </div>
      </div>

      <button id="btn-reset" class="reset-btn">🔄 Reset to Defaults</button>
    </div>

    <!-- RIGHT PANEL: PREVIEW -->
    <div class="panel-right">
      <h1>👁 Preview</h1>
      
      <div class="preview-box">
        <div id="loading" class="loading-skeleton"><div class="spinner"></div></div>
        <div id="error-overlay" class="error-overlay"></div>
        <img id="live-preview" class="preview-img" alt="Card Preview" />
      </div>

      <ul class="info-list">
        <li>Card Dimensions: <span id="info-dim">495 × 195 px</span></li>
        <li>Theme: <span id="info-theme">tokyonight</span></li>
        <li>Cache TTL: <span id="info-ttl">4h (stats)</span></li>
      </ul>

      <h2>Embed Codes</h2>
      <label>Markdown:</label>
      <div id="code-markdown" class="code-block"></div>
      <div class="action-row">
        <button id="btn-copy-md" class="btn-primary">📋 Copy Markdown</button>
      </div>

      <label>Direct URL:</label>
      <div id="code-url" class="code-block"></div>
      <div class="action-row">
        <button id="btn-copy-url">🔗 Copy URL</button>
        <button id="btn-open-tab">↗ Open in Tab</button>
      </div>
    </div>
  </div>

  <script>
    // ── State ─────────────────────────────
    const state = {
      username: 'ajit421',
      cardType: 'stats',
      theme: 'tokyonight',
      options: {
        custom_title: '',
        hide_rank: false,
        show_icons: true,
        hide_border: false,
        layout: 'normal'
      },
      colors: {
        bg_color: '',
        text_color: '',
        title_color: '',
        icon_color: '',
        border_color: ''
      }
    };

    // ── Constants ─────────────────────────
    const API_BASE = 'https://github-stats-api.421mrdark.workers.dev';
    
    // ── DOM References ────────────────────
    const els = {
      username: document.getElementById('username'),
      usernameError: document.getElementById('username-error'),
      cardType: document.getElementById('card-type'),
      theme: document.getElementById('theme'),
      dynamicOptions: document.getElementById('dynamic-options'),
      customColorsSection: document.getElementById('custom-colors-section'),
      previewImg: document.getElementById('live-preview'),
      loading: document.getElementById('loading'),
      errorOverlay: document.getElementById('error-overlay'),
      codeMarkdown: document.getElementById('code-markdown'),
      codeUrl: document.getElementById('code-url'),
      btnCopyMd: document.getElementById('btn-copy-md'),
      btnCopyUrl: document.getElementById('btn-copy-url'),
      btnOpenTab: document.getElementById('btn-open-tab'),
      btnReset: document.getElementById('btn-reset'),
      infoTheme: document.getElementById('info-theme'),
      infoTtl: document.getElementById('info-ttl')
    };

    const colorKeys = ['bg_color', 'text_color', 'title_color', 'icon_color', 'border_color'];
    const colorPickers = {};
    const colorHexes = {};
    
    colorKeys.forEach(k => {
      colorPickers[k] = document.getElementById(`${k}_picker`);
      colorHexes[k] = document.getElementById(`${k}_hex`);
    });

    let debounceTimer = null;

    // ── Dynamic Options Renderer ──────────
    function renderCardOptions() {
      const type = state.cardType;
      let html = '';

      if (type === 'stats') {
        html += `
          <div class="form-group">
            <label>Custom Title</label>
            <input type="text" id="opt_custom_title" placeholder="e.g. My GitHub Stats" value="${state.options.custom_title}">
          </div>
          <label class="toggle-group"><input type="checkbox" id="opt_hide_rank" ${state.options.hide_rank ? 'checked' : ''}> Hide Rank</label>
          <label class="toggle-group"><input type="checkbox" id="opt_show_icons" ${state.options.show_icons ? 'checked' : ''}> Show Icons</label>
          <label class="toggle-group"><input type="checkbox" id="opt_hide_border" ${state.options.hide_border ? 'checked' : ''}> Hide Border</label>
        `;
        els.customColorsSection.style.display = 'block';
        els.infoTtl.textContent = '4h (stats)';
      } 
      else if (type === 'top-langs') {
        html += `
          <label>Layout</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="opt_layout" value="normal" ${state.options.layout === 'normal' ? 'checked' : ''}> Normal</label>
            <label class="radio-label"><input type="radio" name="opt_layout" value="compact" ${state.options.layout === 'compact' ? 'checked' : ''}> Compact</label>
            <label class="radio-label"><input type="radio" name="opt_layout" value="pie" ${state.options.layout === 'pie' ? 'checked' : ''}> Pie</label>
          </div>
          <label class="toggle-group"><input type="checkbox" id="opt_hide_border" ${state.options.hide_border ? 'checked' : ''}> Hide Border</label>
        `;
        els.customColorsSection.style.display = 'block';
        els.infoTtl.textContent = '2h (top-langs)';
      }
      else if (type === 'streak') {
        html += `
          <div class="note">⚠️ Requires GITHUB_TOKEN on the server</div>
          <label class="toggle-group"><input type="checkbox" id="opt_hide_border" ${state.options.hide_border ? 'checked' : ''}> Hide Border</label>
        `;
        els.customColorsSection.style.display = 'block';
        els.infoTtl.textContent = '2h (streak)';
      }
      else if (type === 'commit-activity') {
        html += `
          <label class="toggle-group"><input type="checkbox" id="opt_hide_border" ${state.options.hide_border ? 'checked' : ''}> Hide Border</label>
        `;
        // Commit activity might not support full color overrides in all setups, but we'll leave it visible
        els.customColorsSection.style.display = 'block';
        els.infoTtl.textContent = '2h (commit-activity)';
      }

      els.dynamicOptions.innerHTML = html;
      attachOptionListeners();
    }

    function attachOptionListeners() {
      const bindText = (id, key) => {
        const el = document.getElementById(id);
        if(el) el.addEventListener('input', (e) => { state.options[key] = e.target.value; triggerUpdate(); });
      };
      const bindCheck = (id, key) => {
        const el = document.getElementById(id);
        if(el) el.addEventListener('change', (e) => { state.options[key] = e.target.checked; triggerUpdate(); });
      };
      const bindRadio = (name, key) => {
        const radios = document.querySelectorAll(`input[name="${name}"]`);
        radios.forEach(r => r.addEventListener('change', (e) => {
          if(e.target.checked) { state.options[key] = e.target.value; triggerUpdate(); }
        }));
      };

      bindText('opt_custom_title', 'custom_title');
      bindCheck('opt_hide_rank', 'hide_rank');
      bindCheck('opt_show_icons', 'show_icons');
      bindCheck('opt_hide_border', 'hide_border');
      bindRadio('opt_layout', 'layout');
    }

    // ── URL Builder ───────────────────────
    function buildApiUrl() {
      let endpoint = '';
      if (state.cardType === 'stats') endpoint = '/api/stats';
      if (state.cardType === 'top-langs') endpoint = '/api/top-langs';
      if (state.cardType === 'streak') endpoint = '/api/streak';
      if (state.cardType === 'commit-activity') endpoint = '/api/commit-activity';

      const url = new URL(API_BASE + endpoint);
      
      // Username validation & sanitization
      const safeUsername = state.username.replace(/[^a-zA-Z0-9\\-]/g, '');
      if (safeUsername) url.searchParams.append('username', safeUsername);
      else url.searchParams.append('username', 'ajit421'); // fallback

      if (state.theme && state.theme !== 'default') {
        url.searchParams.append('theme', state.theme);
      }

      // Options
      if (state.cardType === 'stats') {
        if (state.options.custom_title) url.searchParams.append('custom_title', state.options.custom_title);
        if (state.options.hide_rank) url.searchParams.append('hide_rank', 'true');
        if (!state.options.show_icons) url.searchParams.append('show_icons', 'false');
      }
      if (state.cardType === 'top-langs' && state.options.layout !== 'normal') {
        url.searchParams.append('layout', state.options.layout);
      }
      if (state.options.hide_border) {
        url.searchParams.append('hide_border', 'true');
      }

      // Colors
      colorKeys.forEach(k => {
        if (state.colors[k]) {
          const cleanHex = state.colors[k].replace(/[^a-fA-F0-9]/g, '');
          if (cleanHex.length === 3 || cleanHex.length === 6) {
            url.searchParams.append(k, cleanHex);
          }
        }
      });

      return url.toString();
    }

    // ── Embed Code Generator ──────────────
    function updateEmbedCodes(url) {
      els.codeUrl.textContent = url;
      let altText = 'GitHub Stats';
      if (state.cardType === 'top-langs') altText = 'Top Languages';
      if (state.cardType === 'streak') altText = 'GitHub Streak';
      if (state.cardType === 'commit-activity') altText = 'Commit Activity';
      
      els.codeMarkdown.textContent = `![${altText}](${url})`;
      els.infoTheme.textContent = state.theme;
    }

    // ── Preview Updater ───────────────────
    function triggerUpdate() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        updatePreview();
      }, 300);
    }

    async function updatePreview() {
      // Validate username
      const userValid = /^[a-zA-Z0-9][a-zA-Z0-9\\-]{0,38}$/.test(state.username);
      if (!state.username || !userValid) {
        els.username.classList.add('error');
        els.usernameError.classList.add('show');
        return;
      } else {
        els.username.classList.remove('error');
        els.usernameError.classList.remove('show');
      }

      const url = buildApiUrl();
      updateEmbedCodes(url);

      els.loading.classList.add('active');
      els.errorOverlay.classList.remove('active');

      try {
        const res = await fetch(url);
        if (!res.ok) {
          throw new Error(`API returned ${res.status}`);
        }
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        
        els.previewImg.onload = () => {
          els.loading.classList.remove('active');
          URL.revokeObjectURL(objectUrl);
        };
        els.previewImg.onerror = () => {
          throw new Error("Failed to load SVG");
        };
        els.previewImg.src = objectUrl;

      } catch (err) {
        els.loading.classList.remove('active');
        els.errorOverlay.innerHTML = `<h3>⚠️ Render Error</h3><p>${err.message}</p>`;
        els.errorOverlay.classList.add('active');
      }
    }

    // ── Event Listeners ───────────────────
    els.username.addEventListener('input', (e) => {
      state.username = e.target.value;
      triggerUpdate();
    });

    els.cardType.addEventListener('change', (e) => {
      state.cardType = e.target.value;
      // Reset options for new card type appropriately
      state.options = {
        custom_title: '', hide_rank: false, show_icons: true, hide_border: false, layout: 'normal'
      };
      renderCardOptions();
      triggerUpdate();
    });

    els.theme.addEventListener('change', (e) => {
      state.theme = e.target.value;
      // Reset custom colors when theme changes
      colorKeys.forEach(k => {
        state.colors[k] = '';
        colorHexes[k].value = '';
        // We don't reset picker visual to avoid weird snapping, it just overrides when used
      });
      triggerUpdate();
    });

    // Color sync
    colorKeys.forEach(k => {
      colorPickers[k].addEventListener('input', (e) => {
        const hex = e.target.value.substring(1); // remove #
        colorHexes[k].value = hex;
        state.colors[k] = hex;
        triggerUpdate();
      });
      colorHexes[k].addEventListener('input', (e) => {
        let hex = e.target.value.replace(/[^a-fA-F0-9]/g, '');
        state.colors[k] = hex;
        if (hex.length === 6) {
          colorPickers[k].value = '#' + hex;
        }
        triggerUpdate();
      });
    });

    // Buttons
    const copyToClipboard = async (text, btnElement, originalText) => {
      try {
        await navigator.clipboard.writeText(text);
        btnElement.textContent = '✓ Copied!';
        setTimeout(() => { btnElement.textContent = originalText; }, 2000);
      } catch (err) {
        console.error('Copy failed', err);
      }
    };

    els.btnCopyMd.addEventListener('click', () => {
      copyToClipboard(els.codeMarkdown.textContent, els.btnCopyMd, '📋 Copy Markdown');
    });

    els.btnCopyUrl.addEventListener('click', () => {
      copyToClipboard(els.codeUrl.textContent, els.btnCopyUrl, '🔗 Copy URL');
    });

    els.btnOpenTab.addEventListener('click', () => {
      window.open(els.codeUrl.textContent, '_blank');
    });

    els.btnReset.addEventListener('click', () => {
      state.username = 'ajit421';
      state.cardType = 'stats';
      state.theme = 'tokyonight';
      state.options = { custom_title: '', hide_rank: false, show_icons: true, hide_border: false, layout: 'normal' };
      state.colors = { bg_color: '', text_color: '', title_color: '', icon_color: '', border_color: '' };
      
      els.username.value = 'ajit421';
      els.cardType.value = 'stats';
      els.theme.value = 'tokyonight';
      colorKeys.forEach(k => { colorHexes[k].value = ''; });
      
      renderCardOptions();
      triggerUpdate();
    });

    // ── Init ──────────────────────────────
    renderCardOptions();
    updatePreview();

  </script>
</body>
</html>
